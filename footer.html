<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>
  <link rel="stylesheet" href="./scss/footer.css">
  <link rel="stylesheet" href="./scss/footer.css">
</head>
<body>
  <footer class="contact" id="contact">
    <div class="contact__info">
      <div>
        <hr>
        <h4>Contact</h4>
      </div>
      <span>500 Terry Francine Street,<br>San Francisco, CA 94158</span>
      <span>Tel: 123-456-7890<br>Fax: 123-456-7890</span>
      <span>info@mysite.com</span>
      <div class="social">
        <img src="imgs/social-facebook.png" alt="Facebook">
        <img src="imgs/social-twitter.png" alt="Twitter">
        <img src="imgs/social-instagram.png" alt="Instagram">
        <img src="imgs/social-youtube.png" alt="YouTube">
      </div>
      <span>&copy; 2026 by Personal Life Coach.</span>
    </div>

    <form class="form" action="#" method="post">
      <label>First Name *<input type="text" name="first" required></label>
      <label>Last Name *<input type="text" name="last" required></label>
      <label class="full">Email *<input type="email" name="email" required></label>
      <label class="full">Subject<input type="text" name="subject"></label>
      <label class="full">Message<textarea name="message"></textarea></label>
      <button type="submit">Submit</button>
    </form>
  </footer>
</body>
</html>
